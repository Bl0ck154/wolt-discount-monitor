<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Wolt Discount Monitor</title>
  <desc id="desc">A free public dashboard for finding Wolt discounts and promotions in your city.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131b"/>
      <stop offset="1" stop-color="#102d3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23c8e8"/>
      <stop offset="1" stop-color="#73e2c3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="85" r="150" fill="#23c8e8" opacity="0.13" filter="url(#glow)"/>
  <circle cx="100" cy="390" r="155" fill="#73e2c3" opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(72 73)">
    <rect x="0" y="0" width="62" height="62" rx="18" fill="url(#accent)"/>
    <path d="M17 34h8l5-15 8 28 6-19h7" fill="none" stroke="#07131b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="126" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="57" font-weight="750" letter-spacing="-1.5">Wolt Discount Monitor</text>
    <text x="1" y="173" fill="#9fc3cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Find the best Wolt deals in your city.</text>

    <g transform="translate(0 220)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect width="178" height="54" rx="27" fill="#ffffff" opacity="0.07"/>
      <text x="26" y="35" fill="#ffffff" font-size="20" font-weight="650">958 cities</text>

      <g transform="translate(194 0)">
        <rect width="190" height="54" rx="27" fill="#ffffff" opacity="0.07"/>
        <text x="26" y="35" fill="#ffffff" font-size="20" font-weight="650">30 countries</text>
      </g>

      <g transform="translate(400 0)">
        <rect width="216" height="54" rx="27" fill="#ffffff" opacity="0.07"/>
        <text x="26" y="35" fill="#ffffff" font-size="20" font-weight="650">Free to use</text>
      </g>

      <g transform="translate(632 0)">
        <rect width="244" height="54" rx="27" fill="#ffffff" opacity="0.07"/>
        <text x="26" y="35" fill="#ffffff" font-size="20" font-weight="650">Live dashboard</text>
      </g>
    </g>
  </g>
</svg>
