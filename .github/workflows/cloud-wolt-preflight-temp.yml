name: Temporary Wolt cloud preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-wolt-preflight-temp.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Wolt connectivity
        shell: bash
        run: |
          set -euo pipefail
          status="$(
            curl --max-time 30 --silent --show-error --output /tmp/wolt-response.json \
              --write-out '%{http_code}' \
              'https://consumer-api.wolt.com/v1/pages/venue-list/promotions-near-you?lon=25.2682558&lat=54.6901231' \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Accept-Language: en-US,en;q=0.9' \
              -H 'Platform: Web' \
              -H 'Referer: https://wolt.com/' \
              -H 'User-Agent: Mozilla/5.0' \
              || true
          )"
          bytes="$(wc -c < /tmp/wolt-response.json 2>/dev/null || echo 0)"
          echo "Wolt HTTP status: ${status:-request-error}"
          echo "Response bytes: ${bytes}"
          if [[ "$status" != "200" ]]; then
            exit 1
          fi
