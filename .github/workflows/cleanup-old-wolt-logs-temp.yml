name: Temporary cleanup old Wolt logs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-old-wolt-logs-temp.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete logs for old Wolt runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          deleted=0
          for page in 1 2 3; do
            json="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/workflows/check-discounts.yml/runs?per_page=100&page=${page}")"

            mapfile -t ids < <(printf '%s' "$json" | jq -r '.workflow_runs[] | select(.run_number <= 259) | .id')
            for id in "${ids[@]}"; do
              code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${id}/logs")"
              if [[ "$code" == "204" || "$code" == "404" ]]; then
                deleted=$((deleted + 1))
              else
                echo "Failed to delete logs for run ${id}: HTTP ${code}" >&2
                exit 1
              fi
            done
          done
          echo "Processed ${deleted} old Wolt run logs."
