name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate public runtime config
        env:
          WOLT_API_BASE_URL: ${{ vars.WOLT_API_BASE_URL }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const apiBaseUrl = String(process.env.WOLT_API_BASE_URL ?? "").trim().replace(/\/+$/, "");
          writeFileSync("docs/config.js", `window.WOLT_API_BASE_URL = ${JSON.stringify(apiBaseUrl)};\n`, "utf8");
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy attempt 1
        id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before deploy retry 2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        run: sleep 60

      - name: Deploy attempt 2
        id: deploy2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before deploy retry 3
        if: ${{ steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        run: sleep 120

      - name: Deploy attempt 3
        id: deploy3
        if: ${{ steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
