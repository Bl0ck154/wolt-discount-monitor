name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/public-snapshot.mjs"
      - "src/compact-data.mjs"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate public runtime config
        env:
          WOLT_API_BASE_URL: ${{ vars.WOLT_API_BASE_URL }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const apiBaseUrl = String(process.env.WOLT_API_BASE_URL ?? "").trim().replace(/\/+$/, "");
          writeFileSync("docs/config.js", `window.WOLT_API_BASE_URL = ${JSON.stringify(apiBaseUrl)};\n`, "utf8");
          NODE

      - name: Verify optional live API
        env:
          WOLT_API_BASE_URL: ${{ vars.WOLT_API_BASE_URL }}
        shell: bash
        run: |
          api_base_url="${WOLT_API_BASE_URL%/}"
          if [[ -z "${api_base_url}" ]]; then
            echo "Live API variable is not configured; deploying static-only dashboard."
            exit 0
          fi

          http_status="$(
            curl --silent \
              --max-time 20 \
              --output /tmp/wolt-health.json \
              --dump-header /tmp/wolt-health.headers \
              --write-out '%{http_code}' \
              --header 'Origin: https://bl0ck154.github.io' \
              "${api_base_url}/health" \
              || true
          )"

          cors_origin="$(
            awk 'BEGIN { IGNORECASE=1 } /^access-control-allow-origin:/ { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' \
              /tmp/wolt-health.headers 2>/dev/null || true
          )"

          if [[ "${http_status}" == "200" && "${cors_origin}" == "https://bl0ck154.github.io" ]]; then
            echo "Live API health and CORS checks passed."
          else
            echo "::warning::Live API check failed: HTTP ${http_status:-request-error}, CORS origin ${cors_origin:-missing}. The static dashboard will still be deployed."
          fi

      - name: Compact machine data for deployment
        run: node src/compact-data.mjs --root=docs/data

      - name: Prepare lean Pages payload
        shell: bash
        run: |
          rm -rf .pages-site
          mkdir -p .pages-site/data
          cp docs/index.html docs/app.js docs/styles.css docs/mobile.css docs/config.js .pages-site/
          [[ -f docs/.nojekyll ]] && cp docs/.nojekyll .pages-site/ || true
          cp docs/data/cities.json docs/data/latest.json .pages-site/data/
          cp docs/sitemap.xml docs/robots.txt docs/llms.txt .pages-site/
          cp -a docs/assets docs/cities docs/countries docs/methodology .pages-site/

          if [[ -d docs/data/cities ]]; then
            while IFS= read -r -d '' source; do
              destination=".pages-site/${source#docs/}"
              mkdir -p "$(dirname "${destination}")"
              cp "${source}" "${destination}"
            done < <(find docs/data/cities -type f -name latest.json -print0)
          fi

          echo "Pages payload:"
          find .pages-site -type f -printf '%p %s bytes\n' | sort
          payload_bytes="$(du -sb .pages-site | cut -f1)"
          if (( payload_bytes > 100000000 )); then
            echo "::error::Pages payload is unexpectedly large: ${payload_bytes} bytes"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site

      - name: Deploy attempt 1
        id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before deploy retry 2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        run: sleep 60

      - name: Deploy attempt 2
        id: deploy2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before deploy retry 3
        if: ${{ steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        run: sleep 120

      - name: Deploy attempt 3
        id: deploy3
        if: ${{ steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
