name: Deploy GitHub Pages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/public-snapshot.mjs"
      - "src/compact-data.mjs"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Disable legacy VPS live API in published dashboard
        shell: bash
        run: |
          # Only committed GitHub Pages snapshots are used in the VPS-free deployment.
          printf 'window.WOLT_API_BASE_URL = "";\n' > docs/config.js

      - name: Compact machine data for deployment
        run: node src/compact-data.mjs --root=docs/data

      - name: Prepare lean Pages payload
        shell: bash
        run: |
          rm -rf .pages-site
          mkdir -p .pages-site/data
          cp docs/index.html docs/app.js docs/styles.css docs/mobile.css docs/config.js .pages-site/
          [[ -f docs/.nojekyll ]] && cp docs/.nojekyll .pages-site/ || true
          cp docs/data/cities.json docs/data/latest.json .pages-site/data/
          cp docs/sitemap.xml docs/robots.txt docs/llms.txt .pages-site/
          cp -a docs/assets docs/cities docs/countries docs/methodology .pages-site/

          if [[ -d docs/data/cities ]]; then
            while IFS= read -r -d '' source; do
              destination=".pages-site/${source#docs/}"
              mkdir -p "$(dirname "${destination}")"
              cp "${source}" "${destination}"
            done < <(find docs/data/cities -type f -name latest.json -print0)
          fi

          echo "Pages payload:"
          find .pages-site -type f -printf '%p %s bytes\n' | sort
          payload_bytes="$(du -sb .pages-site | cut -f1)"
          if (( payload_bytes > 100000000 )); then
            echo "::error::Pages payload is unexpectedly large: ${payload_bytes} bytes"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site

      - name: Deploy attempt 1
        id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before deploy retry 2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        run: sleep 60

      - name: Deploy attempt 2
        id: deploy2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before deploy retry 3
        if: ${{ steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        run: sleep 120

      - name: Deploy attempt 3
        id: deploy3
        if: ${{ steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        uses: actions/deploy-pages@v5

      - name: Fail if all GitHub Pages deployments failed
        if: ${{ steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure' }}
        run: exit 1
