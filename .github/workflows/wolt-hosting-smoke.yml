name: Wolt hosting transport smoke (temporary)

on:
  push:
    branches:
      - test/wolt-hosting-fallback-20261018
    paths:
      - .github/workflows/wolt-hosting-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-origin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect Cloudflare to Wolt upstream status
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const endpoint = 'https://wolt-discount-probe.bl0ck-c1b.workers.dev/probe';
          try {
            const response = await fetch(endpoint, { signal: AbortSignal.timeout(15000) });
            const data = await response.json();
            console.log(JSON.stringify({
              workerStatus: response.status,
              checkedAt: data.checkedAt,
              woltChecks: data.checks?.map(({name,status,sections,bytes,error,contentType}) => ({
                name,status,sections,bytes,error,contentType
              })),
            }));
            if (!response.ok) process.exitCode = 1;
          } catch (error) {
            console.error(error.name + ': ' + error.message);
            process.exitCode = 1;
          }
          JS
