name: Update Wolt discount monitor

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Comma-separated Wolt city ids, for example ltu/vilnius,deu/berlin"
        required: false
        default: "ltu/vilnius"
      all_cities:
        description: "Check every city from the Wolt catalog (large run)"
        required: false
        default: false
        type: boolean
      runner:
        description: "Execution runner: residential Windows by default, Netcup as fallback"
        required: false
        default: "windows"
        type: choice
        options:
          - windows
          - netcup
  repository_dispatch:
    types: [wolt-discount-monitor]

permissions:
  contents: write

concurrency:
  group: wolt-discount-monitor-update
  cancel-in-progress: false

jobs:
  check:
    runs-on:
      - self-hosted
      - X64
      - wolt
      - ${{ (github.event.inputs.runner || github.event.client_payload.runner || 'windows') == 'netcup' && 'Linux' || 'Windows' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update discount data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_VALUE_SCORE: ${{ vars.MIN_VALUE_SCORE }}
          MIN_GROCERY_PERCENT: ${{ vars.MIN_GROCERY_PERCENT }}
          MIN_RESTAURANT_PERCENT: ${{ vars.MIN_RESTAURANT_PERCENT }}
          MIN_OTHER_PERCENT: ${{ vars.MIN_OTHER_PERCENT }}
          MIN_CASH_VALUE_RATIO: ${{ vars.MIN_CASH_VALUE_RATIO }}
          MIN_UNCONDITIONAL_CASH_REFERENCE: ${{ vars.MIN_UNCONDITIONAL_CASH_REFERENCE }}
          WOLT_CACHE_TTL_HOURS: ${{ vars.WOLT_CACHE_TTL_HOURS }}
          WOLT_REFRESH_CITY_CATALOG: "true"
          WOLT_CITIES: ${{ github.event.inputs.cities || github.event.client_payload.cities || 'ltu/vilnius' }}
          WOLT_ALL_CITIES: ${{ github.event.inputs.all_cities || github.event.client_payload.all_cities || 'false' }}
        run: node src/check-discounts.mjs

      - name: Commit updated data (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update Wolt discount monitor data"
            git push
          } else {
            Write-Host "No data changes to commit."
          }

      - name: Commit updated data (Linux fallback)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Update Wolt discount monitor data"
            git push
          else
            echo "No data changes to commit."
          fi
