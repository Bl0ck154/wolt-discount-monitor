name: Update Wolt discount monitor

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Comma-separated Wolt city ids, for example ltu/vilnius,deu/berlin"
        required: false
        default: "ltu/vilnius"
      all_cities:
        description: "Check every city from the Wolt catalog (large run)"
        required: false
        default: false
        type: boolean
      runner:
        description: "Execution runner (Linux VPS primary; Windows is fallback)"
        required: false
        default: "linux"
        type: choice
        options:
          - windows
          - linux
          - github
      scraperapi_smoke_test:
        description: "Force one tiny Wolt request through ScraperAPI to validate the configured secret"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: wolt-discount-monitor-update
  cancel-in-progress: false

jobs:
  cloud:
    if: inputs.runner == 'github'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$REF_NAME" "https://github.com/${REPOSITORY}.git" "$GITHUB_WORKSPACE"

      - name: Verify Node runtime
        run: node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) process.exit(1)"

      - name: Wolt connectivity preflight
        shell: bash
        env:
          SCRAPERAPI_API_KEY: ${{ secrets.SCRAPERAPI_API_KEY }}
        run: |
          set -euo pipefail
          status="$(
            curl --max-time 30 --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              'https://consumer-api.wolt.com/v1/pages/venue-list/promotions-near-you?lon=25.2682558&lat=54.6901231' \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Accept-Language: en-US,en;q=0.9' \
              -H 'Platform: Web' \
              -H 'Referer: https://wolt.com/' \
              -H 'User-Agent: Mozilla/5.0' \
              || true
          )"
          if [[ "$status" != "200" ]]; then
            if [[ -n "${SCRAPERAPI_API_KEY:-}" ]]; then
              echo "::warning::Direct Wolt preflight returned HTTP ${status:-request-error}; continuing because ScraperAPI fallback is configured."
            else
              echo "::error::Wolt preflight from GitHub-hosted runner returned HTTP ${status:-request-error}. Configure SCRAPERAPI_API_KEY or re-run with runner=windows or runner=linux."
              exit 1
            fi
          fi

      - name: ScraperAPI smoke test
        if: inputs.scraperapi_smoke_test
        env:
          SCRAPERAPI_API_KEY: ${{ secrets.SCRAPERAPI_API_KEY }}
          WOLT_PROXYSCRAPE_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SCRAPERAPI_API_KEY:-}" ]]; then
            echo "::error::SCRAPERAPI_API_KEY repository secret is missing or empty."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { fetchJson } from "./src/wolt-api.mjs";
          const target = "https://consumer-api.wolt.com/v1/pages/restaurants?lat=0&lon=0";
          const result = await fetchJson(target, {
            maxAttempts: 1,
            forceProxy: true,
            proxyDispatcher: null,
            proxyScrapeEnabled: false,
            timeoutMs: 30000,
          });
          if (!Array.isArray(result?.sections)) throw new Error("ScraperAPI returned an unexpected Wolt payload");
          console.log(`ScraperAPI smoke test OK: Wolt sections=${result.sections.length}`);
          NODE

      - name: Run tests
        run: node --test

      - name: Update discount data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_API_KEY: ${{ secrets.SCRAPERAPI_API_KEY }}
          TELEGRAM_ALLOW_SKIP: ${{ vars.TELEGRAM_ALLOW_SKIP }}
          MIN_VALUE_SCORE: ${{ vars.MIN_VALUE_SCORE }}
          MIN_GROCERY_PERCENT: ${{ vars.MIN_GROCERY_PERCENT }}
          MIN_RESTAURANT_PERCENT: ${{ vars.MIN_RESTAURANT_PERCENT }}
          MIN_OTHER_PERCENT: ${{ vars.MIN_OTHER_PERCENT }}
          MIN_CASH_VALUE_RATIO: ${{ vars.MIN_CASH_VALUE_RATIO }}
          MIN_UNCONDITIONAL_CASH_REFERENCE: ${{ vars.MIN_UNCONDITIONAL_CASH_REFERENCE }}
          WOLT_CACHE_TTL_HOURS: ${{ vars.WOLT_CACHE_TTL_HOURS }}
          WOLT_API_TIMEOUT_MS: ${{ vars.WOLT_API_TIMEOUT_MS }}
          WOLT_API_MAX_ATTEMPTS: ${{ vars.WOLT_API_MAX_ATTEMPTS }}
          WOLT_API_RETRY_BASE_MS: ${{ vars.WOLT_API_RETRY_BASE_MS }}
          WOLT_API_RETRY_JITTER_MS: ${{ vars.WOLT_API_RETRY_JITTER_MS }}
          WOLT_REFRESH_CITY_CATALOG: "true"
          WOLT_CITIES: ${{ inputs.cities || 'ltu/vilnius' }}
          WOLT_ALL_CITIES: ${{ inputs.all_cities }}
        run: node src/check-discounts.mjs

      - name: Commit updated data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data docs/cities docs/countries docs/methodology docs/sitemap.xml docs/robots.txt docs/llms.txt docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update Wolt discount monitor data"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${REF_NAME}"
          fi

  self-hosted:
    if: inputs.runner != 'github'
    timeout-minutes: 30
    runs-on:
      - self-hosted
      - X64
      - wolt
      - ${{ inputs.runner == 'windows' && 'Windows' || 'Linux' }}
    steps:
      - name: Checkout repository (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE
          Get-ChildItem -Force | Remove-Item -Recurse -Force
          git clone --quiet --depth 1 --branch $env:REF_NAME "https://github.com/$($env:REPOSITORY).git" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout repository (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git clone --quiet --depth 1 --branch "$REF_NAME" "https://github.com/${REPOSITORY}.git" "$GITHUB_WORKSPACE"

      - name: Verify Node runtime
        run: node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) process.exit(1)"

      - name: Run tests
        run: node --test

      - name: Update discount data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_API_KEY: ${{ secrets.SCRAPERAPI_API_KEY }}
          TELEGRAM_ALLOW_SKIP: ${{ vars.TELEGRAM_ALLOW_SKIP }}
          MIN_VALUE_SCORE: ${{ vars.MIN_VALUE_SCORE }}
          MIN_GROCERY_PERCENT: ${{ vars.MIN_GROCERY_PERCENT }}
          MIN_RESTAURANT_PERCENT: ${{ vars.MIN_RESTAURANT_PERCENT }}
          MIN_OTHER_PERCENT: ${{ vars.MIN_OTHER_PERCENT }}
          MIN_CASH_VALUE_RATIO: ${{ vars.MIN_CASH_VALUE_RATIO }}
          MIN_UNCONDITIONAL_CASH_REFERENCE: ${{ vars.MIN_UNCONDITIONAL_CASH_REFERENCE }}
          WOLT_CACHE_TTL_HOURS: ${{ vars.WOLT_CACHE_TTL_HOURS }}
          WOLT_API_TIMEOUT_MS: ${{ vars.WOLT_API_TIMEOUT_MS }}
          WOLT_API_MAX_ATTEMPTS: ${{ vars.WOLT_API_MAX_ATTEMPTS }}
          WOLT_API_RETRY_BASE_MS: ${{ vars.WOLT_API_RETRY_BASE_MS }}
          WOLT_API_RETRY_JITTER_MS: ${{ vars.WOLT_API_RETRY_JITTER_MS }}
          WOLT_REFRESH_CITY_CATALOG: "true"
          WOLT_CITIES: ${{ inputs.cities || 'ltu/vilnius' }}
          WOLT_ALL_CITIES: ${{ inputs.all_cities }}
        run: node src/check-discounts.mjs

      - name: Commit updated data (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data docs/cities docs/countries docs/methodology docs/sitemap.xml docs/robots.txt docs/llms.txt docs/index.html
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update Wolt discount monitor data"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $pushUrl = "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:REPOSITORY).git"
            git push $pushUrl "HEAD:$($env:REF_NAME)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Commit updated data (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data docs/cities docs/countries docs/methodology docs/sitemap.xml docs/robots.txt docs/llms.txt docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update Wolt discount monitor data"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${REF_NAME}"
          fi
