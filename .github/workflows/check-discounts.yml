name: Update Wolt discount monitor

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Comma-separated Wolt city ids, for example ltu/vilnius,deu/berlin"
        required: false
        default: "ltu/vilnius"
      all_cities:
        description: "Check every city from the Wolt catalog (large run)"
        required: false
        default: false
        type: boolean
      runner:
        description: "Execution runner: windows or a Linux fallback key"
        required: false
        default: "windows"

permissions:
  contents: write

concurrency:
  group: wolt-discount-monitor-update
  cancel-in-progress: false

jobs:
  check:
    timeout-minutes: 30
    runs-on:
      - self-hosted
      - X64
      - wolt
      - ${{ inputs.runner != 'windows' && 'Linux' || 'Windows' }}
    steps:
      - name: Checkout without GitHub Action (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE

          Get-ChildItem -Force | Remove-Item -Recurse -Force
          git clone --depth 1 --branch $env:REF_NAME "https://github.com/$($env:REPOSITORY).git" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout without GitHub Action (Linux fallback)
        if: runner.os == 'Linux'
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git clone --depth 1 --branch "$REF_NAME" "https://github.com/${REPOSITORY}.git" "$GITHUB_WORKSPACE"

      - name: Verify Node runtime
        shell: ${{ runner.os == 'Windows' && 'powershell' || 'bash' }}
        run: |
          node --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) { console.error('Node.js 20+ is required'); process.exit(1); }"

      - name: Run tests
        run: node --test

      - name: Update discount data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOW_SKIP: ${{ vars.TELEGRAM_ALLOW_SKIP }}
          MIN_VALUE_SCORE: ${{ vars.MIN_VALUE_SCORE }}
          MIN_GROCERY_PERCENT: ${{ vars.MIN_GROCERY_PERCENT }}
          MIN_RESTAURANT_PERCENT: ${{ vars.MIN_RESTAURANT_PERCENT }}
          MIN_OTHER_PERCENT: ${{ vars.MIN_OTHER_PERCENT }}
          MIN_CASH_VALUE_RATIO: ${{ vars.MIN_CASH_VALUE_RATIO }}
          MIN_UNCONDITIONAL_CASH_REFERENCE: ${{ vars.MIN_UNCONDITIONAL_CASH_REFERENCE }}
          WOLT_CACHE_TTL_HOURS: ${{ vars.WOLT_CACHE_TTL_HOURS }}
          WOLT_API_TIMEOUT_MS: ${{ vars.WOLT_API_TIMEOUT_MS }}
          WOLT_API_MAX_ATTEMPTS: ${{ vars.WOLT_API_MAX_ATTEMPTS }}
          WOLT_API_RETRY_BASE_MS: ${{ vars.WOLT_API_RETRY_BASE_MS }}
          WOLT_API_RETRY_JITTER_MS: ${{ vars.WOLT_API_RETRY_JITTER_MS }}
          WOLT_REFRESH_CITY_CATALOG: "true"
          WOLT_CITIES: ${{ inputs.cities || 'ltu/vilnius' }}
          WOLT_ALL_CITIES: ${{ inputs.all_cities }}
        run: node src/check-discounts.mjs

      - name: Commit updated data (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update Wolt discount monitor data"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $pushUrl = "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:REPOSITORY).git"
            git push $pushUrl "HEAD:$($env:REF_NAME)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "No data changes to commit."
          }

      - name: Commit updated data (Linux fallback)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Update Wolt discount monitor data"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${REF_NAME}"
          else
            echo "No data changes to commit."
          fi
